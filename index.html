const shuffle=a=>[...a].sort(()=>Math.random()-.5);

const dist=(a,b)=>{
  const R=6371;
  const dLat=(b[0]-a[0])*Math.PI/180;
  const dLon=(b[1]-a[1])*Math.PI/180;
  const lat1=a[0]*Math.PI/180;
  const lat2=b[0]*Math.PI/180;
  const x=Math.sin(dLat/2)**2+
    Math.sin(dLon/2)**2*Math.cos(lat1)*Math.cos(lat2);
  return 2*R*Math.asin(Math.sqrt(x));
};

const scoreFor=km=>Math.max(0,Math.round(5000*Math.exp(-km/1800)));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;"
}[c]));

function pickGame(){
  let seen=[];

  try{
    seen=JSON.parse(localStorage.getItem("terrain-seen")||"[]");
  }catch{
    seen=[];
  }

  let pool=LOCATIONS.filter(l=>!seen.includes(l.id));

  if(pool.length<6){
    seen=[];
    pool=LOCATIONS.slice();
  }

  const picks=shuffle(pool).slice(0,6);
  seen=seen.concat(picks.map(l=>l.id));

  try{
    localStorage.setItem("terrain-seen",JSON.stringify(seen));
  }catch{}

  return picks;
}

function safeLeaderboard(){
  try{
    return JSON.parse(localStorage.getItem("terrain-leaderboard")||"[]");
  }catch{
    return [];
  }
}

function saveLeaderboard(name,total){
  const list=safeLeaderboard();

  list.push({
    name:name.trim()||"ANONYMOUS",
    score:total,
    date:Date.now()
  });

  list.sort((a,b)=>b.score-a.score);

  const top=list.slice(0,20);
  localStorage.setItem("terrain-leaderboard",JSON.stringify(top));

  return top;
}

    zoomInBtn.setAttribute("role","button");

    const zoomOutBtn=L.DomUtil.create(
      "a",
      "leaflet-control-zoom-out",
      container
    );

    zoomOutBtn.href="#";
    zoomOutBtn.title="Zoom out";
    zoomOutBtn.innerHTML="&#8722;";
    zoomOutBtn.setAttribute("role","button");

    const doZoom=delta=>{
      if(map._loaded===false)return;

      const target=satLastMouseLatLng||map.getCenter();
      const newZoom=map._limitZoom(map.getZoom()+delta);

      map.setZoomAround(target,newZoom);
    };

    L.DomEvent
      .on(zoomInBtn,"click",L.DomEvent.stop)
      .on(zoomInBtn,"click",()=>doZoom(1));

    L.DomEvent
      .on(zoomOutBtn,"click",L.DomEvent.stop)
      .on(zoomOutBtn,"click",()=>doZoom(-1));

    const updateState=()=>{
      zoomInBtn.classList.toggle(
        "leaflet-disabled",
        map.getZoom()>=map.getMaxZoom()
      );

      zoomOutBtn.classList.toggle(
        "leaflet-disabled",
        map.getZoom()<=map.getMinZoom()
      );
    };

    map.on("zoomend zoomlevelschange",updateState);
    updateState();

    return container;
  }
});

function setupSatellite(){
  satMap=L.map("satellite",{
    zoomControl:false,
    attributionControl:true,
    worldCopyJump:false,
    zoomSnap:1,
    dragging:true
  });

  new CursorZoomControl().addTo(satMap);

  satMap.on("mousemove",e=>{
    const target=e.originalEvent&&e.originalEvent.target;

    if(target&&target.closest&&target.closest(".leaflet-control")){
      return;
    }

    satLastMouseLatLng=e.latlng;
  });

  satMap.on("mouseout",e=>{
    const related=e.originalEvent&&e.originalEvent.relatedTarget;

    if(related&&satMap.getContainer().contains(related)){
      return;
    }

    satLastMouseLatLng=null;
  });

  const satTiles=L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom:19,
      attribution:"© Esri, Maxar, Earthstar Geographics"
    }
  ).addTo(satMap);

  satTiles.on("tileerror",()=>{
    satTileErrors++;

    if(satTileErrors>=6&&!satTileErrorEl){
      satTileErrorEl=document.createElement("div");

      satTileErrorEl.style.cssText=
        "position:absolute;z-index:1300;left:18px;top:18px;right:18px;" +
        "background:rgba(120,20,15,.92);color:#f5ede9;padding:14px 18px;" +
        "font-size:12px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.25);";

      satTileErrorEl.textContent=
        "Satellite imagery isn't loading — check your internet connection or try refreshing.";

      document.getElementById("stage").appendChild(satTileErrorEl);
    }
  });

  satTiles.on("tileload",()=>{
    if(satTileErrorEl){
      satTileErrorEl.remove();
      satTileErrorEl=null;
    }

    satTileErrors=0;
  });
}

function setupGuessMap(){
  guessMap=L.map("guessMap",{
    zoomControl:true,
    attributionControl:true,
    worldCopyJump:true,
    minZoom:2,
    maxZoom:19
  }).setView([20,0],2);

  L.maplibreGL({
    style:"https://tiles.openfreemap.org/styles/positron"
  }).addTo(guessMap);

  guessMap.on("click",e=>{
    if(!submitted){
      setGuess([e.latlng.lat,e.latlng.lng]);
    }
  });
}

let resizeTimer=null;

window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);

  resizeTimer=setTimeout(()=>{
    if(satMap){
      satMap.invalidateSize();

      if(satBounds){
        fitSatelliteToBounds(satLocBounds);
      }
    }

    if(guessMap){
      guessMap.invalidateSize();
    }
  },200);
});

function renderRound(){
  const loc=game[round];

  guess=null;
  submitted=false;
  expanded=false;

  document.getElementById("roundText").textContent=
    `ROUND ${String(round+1).padStart(2,"0")} / 06`;

  document.getElementById("scoreText").textContent=
    score.toLocaleString();

  document.getElementById("category").textContent=loc.category;
  document.getElementById("clue").textContent=loc.clue;
  document.getElementById("guessStatus").textContent="PLACE YOUR GUESS";

  document.getElementById("guessPanel").classList.remove("expanded");
  document.getElementById("toggleMap").textContent="EXPAND MAP ↗";
  document.getElementById("result").innerHTML="";

  const submit=document.getElementById("submit");

  submit.disabled=true;
  submit.classList.add("disabled");
  submit.innerHTML='LOCK IN GUESS <span>→</span>';

  satMap.eachLayer(layer=>{
    if(layer instanceof L.Marker||layer instanceof L.Polyline){
      layer.remove();
    }
  });

  satMap.invalidateSize();
  fitSatelliteToBounds(loc.bounds);

  guessMap.setView([20,0],2);

  if(guessMarker){
    guessMarker.remove();
    guessMarker=null;
  }

  if(answerMarker){
    answerMarker.remove();
    answerMarker=null;
  }

  if(line1){
    line1.remove();
    line1=null;
  }

  if(line2){
    line2.remove();
    line2=null;
  }
}

function fitSatelliteToBounds(bounds){
  satMap.setMaxBounds(null);
  satMap.setMinZoom(0);
  satMap.setMaxZoom(17);

  satMap.fitBounds(bounds,{padding:[10,10]});

  const initialZoom=satMap.getZoom();

  satMap.setMinZoom(initialZoom);

  const visibleBounds=satMap.getBounds().pad(0.15);

  satMap.setMaxBounds(visibleBounds);
  satMap.options.maxBoundsViscosity=1;

  satMap.setView(satMap.getCenter(),initialZoom);

  satBounds=visibleBounds;
  satLocBounds=bounds;
}

function setGuess(selectedGuess){
  guess=selectedGuess;

  if(guessMarker){
    guessMarker.remove();
  }

  guessMarker=L.marker(guess,{
    icon:icon("guess","YOU")
  }).addTo(guessMap);

  document.getElementById("guessStatus").textContent="PIN PLACED";

  const submit=document.getElementById("submit");

  submit.disabled=false;
  submit.classList.remove("disabled");
}

function submitGuess(){
  if(!guess||submitted){
    return;
  }

  submitted=true;

  const loc=game[round];
  const km=dist(guess,loc.coords);
  const points=scoreFor(km);

  score+=points;

  document.getElementById("scoreText").textContent=
    score.toLocaleString();

  document.getElementById("guessStatus").textContent="RESULT";

  const submit=document.getElementById("submit");

  submit.disabled=true;
  submit.textContent="GUESS LOCKED";

  if(answerMarker){
    answerMarker.remove();
  }

  answerMarker=L.marker(loc.coords,{
    icon:icon("actual","ANSWER")
  }).addTo(guessMap);

  if(line1)line1.remove();
  if(line2)line2.remove();

  line1=L.polyline(
    [guess,loc.coords],
    {
      color:"#0a0f0c",
      weight:10,
      opacity:.95
    }
  ).addTo(guessMap);

  line2=L.polyline(
    [guess,loc.coords],
    {
      color:"#f5c542",
      weight:5,
      opacity:1,
      dashArray:"10 8"
    }
  ).addTo(guessMap);

  const group=L.latLngBounds([guess,loc.coords]);

  guessMap.fitBounds(group,{
    padding:[90,90],
    maxZoom:5
  });

  expanded=true;

  document
    .getElementById("guessPanel")
    .classList.add("expanded");

  document.getElementById("toggleMap").textContent="MINIMIZE MAP ↙";

  setTimeout(()=>guessMap.invalidateSize(),300);

  document.getElementById("result").innerHTML=`
    <div class="result-card">
      <div class="eyebrow">FIELD NOTE · ${esc(loc.category)}</div>

      <h2>${esc(loc.name)}</h2>

      <div class="result-stats">
        <div>
          <span>DISTANCE</span>
          <strong>${Math.round(km).toLocaleString()} km</strong>
        </div>

        <div>
          <span>ROUND SCORE</span>
          <strong>+${points.toLocaleString()}</strong>
        </div>
      </div>

      <p>${esc(loc.story)}</p>

      <div class="hint-line">
        <b>What to notice:</b> ${esc(loc.hint)}
      </div>

      ${
        round<5
          ? '<button class="primary" id="nextBtn">NEXT LANDSCAPE →</button>'
          : '<div class="final-note">Final round complete. Your expedition score is shown next.</div>'
      }
    </div>
  `;

  if(round<5){
    document.getElementById("nextBtn").onclick=nextRound;
  }else{
    setTimeout(showFinal,900);
  }
}

function nextRound(){
  round++;
  renderRound();
}

function showFinal(){
  const total=score;
  const list=safeLeaderboard();

  if(window.goatcounter&&window.goatcounter.count){
    window.goatcounter.count({
      path:"game-completed",
      title:"Game completed",
      event:true
    });
  }

  document.getElementById("app").innerHTML=`
    <div class="end-screen">
      <div class="end-inner">
        <div class="eyebrow">EXPEDITION COMPLETE</div>

        <h1>
          ${total.toLocaleString()}
          <span>/ 30,000</span>
        </h1>

        <p>Six landscapes. One score. You read the terrain.</p>

        <div class="name-row">
          <input id="nameInput" maxlength="18" placeholder="ENTER YOUR NAME">
          <button id="saveBtn">SAVE SCORE</button>
        </div>

        <div class="leaderboard">
          <div class="eyebrow">LOCAL LEADERBOARD</div>
          <div id="rows"></div>
        </div>

        <button class="primary" id="againBtn">PLAY AGAIN →</button>
      </div>
    </div>
  `;

  const drawRows=entries=>{
    document.getElementById("rows").innerHTML=
      entries.slice(0,10).map((entry,index)=>`
        <div class="leader-row">
          <span>
            ${String(index+1).padStart(2,"0")}
            ${esc(entry.name)}
          </span>

          <strong>${Number(entry.score).toLocaleString()}</strong>
        </div>
      `).join("");
  };

  drawRows(list);

  document.getElementById("saveBtn").onclick=()=>{
    const updated=saveLeaderboard(
      document.getElementById("nameInput").value,
      total
    );

    drawRows(updated);
  };

  document.getElementById("againBtn").onclick=()=>{
    game=pickGame();
    round=0;
    score=0;
    guess=null;
    submitted=false;
    satMap=null;
    guessMap=null;

    document.getElementById("app").innerHTML="";

    init();
  };
}

init();
</script>
</body>
</html>
