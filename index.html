const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const dist=(a,b)=>{const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180,lat1=a[0]*Math.PI/180,lat2=b[0]*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.sin(dLon/2)**2*Math.cos(lat1)*Math.cos(lat2);return 2*R*Math.asin(Math.sqrt(x));};
function distanceToBoundsKm(point,bounds){
const lat=Math.max(bounds[0][0],Math.min(bounds[1][0],point[0]));
const lng=Math.max(bounds[0][1],Math.min(bounds[1][1],point[1]));
return dist(point,[lat,lng]);
}
function scoreForGuess(point,loc,modeId){
if(modeId==="city"){
const missKm=distanceToBoundsKm(point,loc.bounds);
return Math.max(0,Math.round(5000*Math.exp(-missKm/600)));
}
const km=dist(point,loc.coords),perfectRadius=15;
if(km<=perfectRadius)return 5000;
return Math.max(0,Math.round(5000*Math.exp(-(km-perfectRadius)/1800)));
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pickGame(pool,modeId){
let seen=[];try{seen=JSON.parse(localStorage.getItem("terrain-seen")||"[]")}catch{seen=[]}
seen=seen.filter(id=>id.startsWith(modeId+":"));
let available=pool.filter(l=>!seen.includes(modeId+":"+l.id));
if(available.length<6){seen=[];available=pool.slice()}
const picks=shuffle(available).slice(0,6);
seen=seen.concat(picks.map(l=>l.id));
seen=seen.map(id=>id.startsWith(modeId+":")?id:modeId+":"+id);
try{localStorage.setItem("terrain-seen",JSON.stringify(seen))}catch{}
return picks;
}
const MODES={city:{id:"city",name:"CITY MODE",locations:CITY_LOCATIONS},landscape:{id:"landscape",name:"LANDSCAPE MODE",locations:LOCATIONS}};
let activeMode=null,game=[],round=0,guess=null,submitted=false,score=0,expanded=false;
let satMap=null,guessMap=null,guessMarker=null,answerMarker=null,line1=null,line2=null;
let satBounds=null,satLocBounds=null;

function icon(cls,label){return L.divIcon({className:"",html:'<div class="answer-marker '+cls+'">'+label+"</div>",iconSize:[40,40],iconAnchor:[20,20]});}
function safeLeaderboard(){try{return JSON.parse(localStorage.getItem("terrain-leaderboard")||"[]")}catch{return[]}}
function saveLeaderboard(name,total){const list=safeLeaderboard();list.push({name:name.trim()||"ANONYMOUS",score:total,date:Date.now()});list.sort((a,b)=>b.score-a.score);const top=list.slice(0,20);localStorage.setItem("terrain-leaderboard",JSON.stringify(top));return top;}

function init(){
  renderMenu();
}
function renderMenu(){
document.getElementById("app").innerHTML=`<div class="mode-screen"><div class="mode-inner"><div class="eyebrow">TERRAIN · CHOOSE AN EXPEDITION</div><h1>READ THE WORLD<br>FROM ABOVE.</h1><p class="mode-intro">Every round shows a location at a consistent scale. Choose a mode by clicking anywhere on its card.</p><div class="mode-grid"><button class="mode-card" data-mode="city"><div class="eyebrow">12 LOCATIONS</div><h2>CITY MODE</h2><p>Identify major cities by their coastlines, rivers, street patterns, mountains and urban form. Every city uses the same approximately 70 × 55 km view. Clicking anywhere within the curated city area earns full points.</p><div class="mode-meta">CLICK ANYWHERE TO START →</div></button><button class="mode-card" data-mode="landscape"><div class="eyebrow">GLOBAL COLLECTION</div><h2>LANDSCAPE MODE</h2><p>Read agriculture, water, energy, extraction and natural systems from satellite imagery.</p><div class="mode-meta">CLICK ANYWHERE TO START →</div></button></div></div></div>`;
document.querySelectorAll(".mode-card[data-mode]").forEach(card=>card.onclick=()=>startMode(card.dataset.mode));
}
function startMode(modeId){
  activeMode=MODES[modeId];
  game=pickGame(activeMode.locations,activeMode.id);
  round=0;score=0;guess=null;submitted=false;satMap=null;guessMap=null;
  renderShell();
  setupSatellite();
  setupGuessMap();
  renderRound();
}

function renderShell(){
document.getElementById("app").innerHTML=`
<main class="app"><header class="topbar"><div class="brand">TERRAIN</div><div class="round" id="roundText"></div><div class="hud-right"><div class="score">SCORE <strong id="scoreText">0</strong></div></div></header>
<section class="intro"><div class="eyebrow" id="category"></div><h1 id="clue"></h1><p>Study the landscape. Use the satellite view, then place your best guess on the world map.</p></section>
<section class="game-stage" id="stage"><div id="satellite" class="satellite-map"></div>
<div id="guessPanel" class="guess-panel"><div class="guess-map-header"><div><div class="eyebrow">GUESS MAP</div><div class="guess-status" id="guessStatus">PLACE YOUR GUESS</div></div><button class="map-toggle" id="toggleMap">EXPAND MAP ↗</button></div><div id="guessMap" class="guess-map"></div><div class="guess-attribution"><a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div><button class="submit map-submit disabled" id="submit" disabled>LOCK IN GUESS <span>→</span></button></div>
<div class="bottom-left"><div class="tip"><span>01</span><b>STUDY THE LANDSCAPE</b></div><div class="tip"><span>02</span><b>DROP YOUR PIN ON THE GUESS MAP</b></div></div>
<div id="result"></div></section></main>`;
document.getElementById("toggleMap").onclick=()=>{expanded=!expanded;document.getElementById("guessPanel").classList.toggle("expanded",expanded);document.getElementById("toggleMap").textContent=expanded?"MINIMIZE MAP ↙":"EXPAND MAP ↗";setTimeout(()=>guessMap.invalidateSize(),280)};
document.getElementById("submit").onclick=submitGuess;
}

let satTileErrors=0,satTileErrorEl=null,satLastMouseLatLng=null;
const CursorZoomControl=L.Control.extend({
options:{position:"topleft"},
onAdd:function(map){
const container=L.DomUtil.create("div","leaflet-control-zoom leaflet-bar leaflet-control");
const zoomInBtn=L.DomUtil.create("a","leaflet-control-zoom-in",container);
zoomInBtn.href="#";zoomInBtn.title="Zoom in";zoomInBtn.innerHTML="+";zoomInBtn.setAttribute("role","button");
const zoomOutBtn=L.DomUtil.create("a","leaflet-control-zoom-out",container);
zoomOutBtn.href="#";zoomOutBtn.title="Zoom out";zoomOutBtn.innerHTML="&#8722;";zoomOutBtn.setAttribute("role","button");
const doZoom=delta=>{
if(map._loaded===false)return;
const target=satLastMouseLatLng||map.getCenter();
const newZoom=map._limitZoom(map.getZoom()+delta);
map.setZoomAround(target,newZoom);
};
L.DomEvent.on(zoomInBtn,"click",L.DomEvent.stop).on(zoomInBtn,"click",()=>doZoom(1));
L.DomEvent.on(zoomOutBtn,"click",L.DomEvent.stop).on(zoomOutBtn,"click",()=>doZoom(-1));
const updateState=()=>{
zoomInBtn.classList.toggle("leaflet-disabled",map.getZoom()>=map.getMaxZoom());
zoomOutBtn.classList.toggle("leaflet-disabled",map.getZoom()<=map.getMinZoom());
};
map.on("zoomend zoomlevelschange",updateState);
updateState();
return container;
}
});
function setupSatellite(){
satMap=L.map("satellite",{zoomControl:false,attributionControl:true,worldCopyJump:false,zoomSnap:1,dragging:true});
new CursorZoomControl().addTo(satMap);
satMap.on("mousemove",e=>{
const t=e.originalEvent&&e.originalEvent.target;
if(t&&t.closest&&t.closest(".leaflet-control"))return;
satLastMouseLatLng=e.latlng;
});
satMap.on("mouseout",e=>{
const to=e.originalEvent&&e.originalEvent.relatedTarget;
if(to&&satMap.getContainer().contains(to))return;
satLastMouseLatLng=null;
});
const satTiles=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"© Esri, Maxar, Earthstar Geographics"}).addTo(satMap);
satTiles.on("tileerror",()=>{
satTileErrors++;
if(satTileErrors>=6&&!satTileErrorEl){
satTileErrorEl=document.createElement("div");
satTileErrorEl.style.cssText="position:absolute;z-index:1300;left:18px;top:18px;right:18px;background:rgba(120,20,15,.92);color:#f5ede9;padding:14px 18px;font-size:12px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.25);";
satTileErrorEl.textContent="Satellite imagery isn't loading — check your internet connection or try refreshing.";
document.getElementById("stage").appendChild(satTileErrorEl);
}
});
satTiles.on("tileload",()=>{
if(satTileErrorEl){satTileErrorEl.remove();satTileErrorEl=null}
satTileErrors=0;
});
}
function setupGuessMap(){
guessMap=L.map("guessMap",{zoomControl:true,attributionControl:true,worldCopyJump:true,minZoom:2,maxZoom:19}).setView([20,0],2);
L.maplibreGL({style:"https://tiles.openfreemap.org/styles/positron"}).addTo(guessMap);
guessMap.on("click",e=>{if(!submitted){setGuess([e.latlng.lat,e.latlng.lng]);}});
}
let resizeTimer=null;
window.addEventListener("resize",()=>{
clearTimeout(resizeTimer);
resizeTimer=setTimeout(()=>{
if(satMap){
satMap.invalidateSize();
if(satBounds)fitSatelliteToBounds(satLocBounds);
}
if(guessMap)guessMap.invalidateSize();
},200);
});

function renderRound(){
const loc=game[round];guess=null;submitted=false;expanded=false;
document.getElementById("roundText").textContent=`${activeMode.name} · ROUND ${String(round+1).padStart(2,"0")} / 06`;
document.getElementById("scoreText").textContent=score.toLocaleString();
document.getElementById("category").textContent=loc.category;
document.getElementById("clue").textContent=loc.clue;
document.getElementById("guessStatus").textContent="PLACE YOUR GUESS";
document.getElementById("guessPanel").classList.remove("expanded");
document.getElementById("toggleMap").textContent="EXPAND MAP ↗";
document.getElementById("result").innerHTML="";
document.getElementById("submit").disabled=true;document.getElementById("submit").classList.add("disabled");
satMap.eachLayer(l=>{if(l instanceof L.Marker||l instanceof L.Polyline){l.remove()}});
satMap.invalidateSize();
fitSatelliteToBounds(loc.bounds);
guessMap.setView([20,0],2);
if(guessMarker){guessMarker.remove();guessMarker=null}if(answerMarker){answerMarker.remove();answerMarker=null}if(line1){line1.remove();line1=null}if(line2){line2.remove();line2=null}
}
function fitSatelliteToBounds(bounds){
satMap.setMaxBounds(null);
satMap.setMinZoom(0);
satMap.setMaxZoom(17);
satMap.fitBounds(bounds,{padding:[10,10]});
const initialZoom=satMap.getZoom();
satMap.setMinZoom(initialZoom);
const visibleBounds=satMap.getBounds().pad(0.15);
satMap.setMaxBounds(visibleBounds);
satMap.options.maxBoundsViscosity=1;
satMap.setView(satMap.getCenter(),initialZoom);
satBounds=visibleBounds;
satLocBounds=bounds;
}

function setGuess(g){
guess=g;
if(guessMarker)guessMarker.remove();
guessMarker=L.marker(g,{icon:icon("guess","YOU")}).addTo(guessMap);
document.getElementById("guessStatus").textContent="PIN PLACED";
document.getElementById("submit").disabled=false;document.getElementById("submit").classList.remove("disabled");
}
function submitGuess(){
if(!guess||submitted)return;
submitted=true;const loc=game[round],km=dist(guess,loc.coords),pts=scoreForGuess(guess,loc,activeMode.id);score+=pts;
document.getElementById("scoreText").textContent=score.toLocaleString();document.getElementById("guessStatus").textContent="RESULT";
document.getElementById("submit").disabled=true;document.getElementById("submit").textContent="GUESS LOCKED";
if(answerMarker)answerMarker.remove();answerMarker=L.marker(loc.coords,{icon:icon("actual","ANSWER")}).addTo(guessMap);
if(line1)line1.remove();if(line2)line2.remove();
line1=L.polyline([guess,loc.coords],{color:"#0a0f0c",weight:10,opacity:.95}).addTo(guessMap);
line2=L.polyline([guess,loc.coords],{color:"#f5c542",weight:5,opacity:1,dashArray:"10 8"}).addTo(guessMap);
const group=L.latLngBounds([guess,loc.coords]);guessMap.fitBounds(group,{padding:[90,90],maxZoom:5});
expanded=true;document.getElementById("guessPanel").classList.add("expanded");document.getElementById("toggleMap").textContent="MINIMIZE MAP ↙";
setTimeout(()=>guessMap.invalidateSize(),300);
document.getElementById("result").innerHTML=`<div class="result-card"><div class="eyebrow">FIELD NOTE · ${esc(loc.category)}</div><h2>${esc(loc.name)}</h2><div class="result-stats"><div><span>DISTANCE TO CENTER</span><strong>${Math.round(km).toLocaleString()} km</strong></div><div><span>ROUND SCORE</span><strong>+${pts.toLocaleString()}</strong></div></div><p>${esc(loc.story)}</p><div class="hint-line"><b>What to notice:</b> ${esc(loc.hint)}</div>${round<5?'<button class="primary" id="nextBtn">NEXT ROUND →</button>':'<div class="final-note">Final round complete. Your expedition score is shown next.</div>'}</div>`;
if(round<5)document.getElementById("nextBtn").onclick=nextRound;else setTimeout(showFinal,900);
}
function nextRound(){round++;renderRound();}
function showFinal(){
const total=score,list=safeLeaderboard();
if(window.goatcounter&&window.goatcounter.count){
window.goatcounter.count({path:"game-completed",title:"Game completed",event:true});
}
document.getElementById("app").innerHTML=`<div class="end-screen"><div class="end-inner"><div class="eyebrow">${activeMode.name} COMPLETE</div><h1>${total.toLocaleString()} <span>/ 30,000</span></h1><p>Six rounds. One score. You read the terrain.</p><div class="name-row"><input id="nameInput" maxlength="18" placeholder="ENTER YOUR NAME"><button id="saveBtn">SAVE SCORE</button></div><div class="leaderboard"><div class="eyebrow">LOCAL LEADERBOARD</div><div id="rows"></div></div><button class="primary" id="againBtn">PLAY AGAIN →</button> <button class="primary" id="menuBtn">CHOOSE MODE</button></div></div>`;
const drawRows=arr=>document.getElementById("rows").innerHTML=arr.slice(0,10).map((e,i)=>`<div class="leader-row"><span>${String(i+1).padStart(2,"0")} ${esc(e.name)}</span><strong>${Number(e.score).toLocaleString()}</strong></div>`).join("");
drawRows(list);
document.getElementById("saveBtn").onclick=()=>{const updated=saveLeaderboard(document.getElementById("nameInput").value,total);drawRows(updated)};
document.getElementById("againBtn").onclick=()=>startMode(activeMode.id);
document.getElementById("menuBtn").onclick=()=>{activeMode=null;renderMenu()};
}
init();
</script>
</body></html>
